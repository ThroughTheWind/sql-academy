name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json', 'dotnet-tools.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore SqlAcademy.slnx

      - name: Build solution
        run: dotnet build SqlAcademy.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SqlAcademy.UnitTests/SqlAcademy.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Compile integration tests
        run: dotnet build tests/SqlAcademy.IntegrationTests/SqlAcademy.IntegrationTests.csproj --configuration Release --no-restore

      - name: Compile performance tests
        run: dotnet build tests/SqlAcademy.PerformanceTests/SqlAcademy.PerformanceTests.csproj --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format SqlAcademy.slnx --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx