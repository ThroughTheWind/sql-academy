services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlacademy-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - sqlacademy-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlacademy-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      LEARNING_DB_NAME: ${LEARNING_DB_NAME}
    volumes:
      - ./:/workspace:ro
    working_dir: /workspace
    command: ["/bin/bash", "/workspace/infra/scripts/init-database.sh"]
    networks:
      - sqlacademy-net
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    container_name: sqlacademy-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT}:4318"
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - sqlacademy-net
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--config=/etc/otelcol-contrib/config.yaml", "--dry-run"]
      interval: 20s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/apps/SqlAcademy.Api/Dockerfile
    container_name: sqlacademy-api
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LearningDb: Server=sqlserver,1433;Database=${LEARNING_DB_NAME};User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;ConnectRetryCount=3;ConnectRetryInterval=10
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "${API_HTTP_PORT}:8080"
    networks:
      - sqlacademy-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/apps/SqlAcademy.Worker/Dockerfile
    container_name: sqlacademy-worker
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__LearningDb: Server=sqlserver,1433;Database=${LEARNING_DB_NAME};User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;ConnectRetryCount=3;ConnectRetryInterval=10
      OpenTelemetry__Endpoint: http://otel-collector:4317
    networks:
      - sqlacademy-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sqlacademy-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - sqlacademy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: sqlacademy-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - sqlacademy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  sqlacademy-net:
    driver: bridge

volumes:
  sqlserver-data:
  grafana-data: